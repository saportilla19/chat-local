<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat del equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--pine:#0f4c45;--leaf:#19a974;--mine:#d3f1c7;--bg:#dde6e1;--ink:#1b2b27;--mute:#6b7c76}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--pine)}
#login form{background:#fff;border-radius:20px;padding:28px;width:min(360px,100%);display:grid;gap:14px}
#login h1{font-size:1.6rem;font-weight:800}
#login p{color:var(--mute)}
input[type=text],input[type=password]{font:inherit;padding:12px 14px;border:2px solid #cfdad5;border-radius:12px;width:100%}
.primary{background:var(--leaf);color:#fff;font-weight:800;padding:12px;border-radius:12px}
#err{color:#b3261e;min-height:1.2em;font-size:.9rem}
#app{display:none;height:100dvh;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg)}
header{background:var(--pine);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header b{display:block;font-size:1.1rem}
header small{opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex}.msg.own{justify-content:flex-end}
.bubble{max-width:min(78%,520px);background:#fff;border-radius:14px 14px 14px 4px;padding:7px 10px;overflow-wrap:anywhere}
.own .bubble{background:var(--mine);border-radius:14px 14px 4px 14px}
.bubble.sticker{background:none;padding:0}
.who{font-weight:800;font-size:.82rem}
.bubble p{white-space:pre-wrap}
.bubble img.pic{display:block;max-width:100%;max-height:320px;border-radius:10px;margin:3px 0;cursor:zoom-in}
.bubble img.st{width:130px;height:130px;display:block}
time{display:block;text-align:right;font-size:.7rem;color:var(--mute)}
#stickers{display:none;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:10px;background:#fff;max-height:210px;overflow-y:auto;border-top:1px solid #cfdad5}
#stickers button{background:none;padding:2px;border-radius:10px}
#stickers img{width:100%;display:block}
#bar{display:flex;gap:8px;align-items:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#f3f6f4}
#bar input{flex:1;border-radius:22px}
.ic{width:42px;height:42px;border-radius:50%;background:#fff;font-size:1.2rem;flex:none}
#send{background:var(--leaf);color:#fff}
#zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);place-items:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:94vh}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

header{display:flex;align-items:center;gap:8px}header>div{flex:1;min-width:0}
#mute{background:none;color:#fff;font-size:1.3rem}
#emoji{display:none;border-top:1px solid #cfdad5;background:#fff}
emoji-picker{width:100%;height:300px}
#editor{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);place-items:center;z-index:10;padding:16px}
#editor .box{background:#fff;border-radius:20px;padding:16px;width:min(380px,100%);display:grid;gap:10px}
#cv{width:100%;aspect-ratio:1;border-radius:12px;background:repeating-conic-gradient(#e6ece9 0 25%,#fff 0 50%) 0 0/20px 20px;touch-action:none;cursor:grab}
.row{display:flex;gap:8px;align-items:center}.row input[type=range]{flex:1}.row select{font:inherit;padding:8px;border-radius:10px}
.ghost{background:#e6ece9;padding:10px 14px;border-radius:12px;font-weight:600}
#stickers .mine{position:relative}
#stickers .del{position:absolute;top:0;right:0;width:22px;height:22px;border-radius:50%;background:#000a;color:#fff;font-size:.7rem;padding:0}
#stickers .add{aspect-ratio:1;border:2px dashed var(--leaf);border-radius:14px;color:var(--leaf);font-weight:800;font-size:.85rem}
#rec{display:none;gap:10px;align-items:center;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#f3f6f4}
#recT{flex:1;font-weight:800;color:#b3261e}
.bubble audio{width:230px;max-width:100%;display:block;margin:3px 0}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3/index.js"></script>
</head>
<body>
<div id="login">
  <form id="lf">
    <h1>Chat del equipo</h1>
    <p>Elige un nombre para entrar.</p>
    <input type="text" id="name" placeholder="Tu nombre" maxlength="20" autocomplete="nickname" required>
    <input type="password" id="code" placeholder="Código de acceso" style="display:none">
    <div id="err" role="alert"></div>
    <button class="primary">Entrar al chat</button>
  </form>
</div>
<div id="app">
  <header><div><b>Chat del equipo</b><small id="online">Conectando…</small></div><button id="mute" aria-label="Activar o silenciar sonido">🔔</button></header>
  <div id="list"></div>
  <div id="emoji"><emoji-picker locale="es" data-source="https://cdn.jsdelivr.net/npm/emoji-picker-element-data@^1/es/emojibase/data.json"></emoji-picker></div><div id="stickers"></div>
  <div id="rec"><span id="recT">● 0:00</span><button class="ghost" id="recX">Cancelar</button><button class="primary" id="recOk">Enviar</button></div>
  <div id="bar">
    <button class="ic" id="emBtn" title="Emojis" aria-label="Emojis">😊</button><button class="ic" id="stBtn" title="Stickers" aria-label="Stickers">🏷️</button>
    <button class="ic" id="imgBtn" title="Enviar imagen" aria-label="Enviar imagen">📎</button>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="text" id="text" placeholder="Escribe un mensaje" autocomplete="off">
    <button class="ic" id="mic" title="Grabar audio" aria-label="Grabar audio">🎤</button><button class="ic" id="send" aria-label="Enviar">➤</button>
  </div>
</div>
<input type="file" id="sfile" accept="image/*" hidden>
<div id="editor"><div class="box">
<b>Crear sticker</b>
<canvas id="cv" width="512" height="512"></canvas>
<div class="row"><span>Zoom</span><input type="range" id="zm" min="1" max="4" step="0.05" value="1" aria-label="Zoom"></div>
<div class="row"><select id="shape" aria-label="Forma"><option value="round">Esquinas redondas</option><option value="circle">Círculo</option><option value="square">Cuadrado</option></select><input type="text" id="cap" placeholder="Texto (opcional)" maxlength="24"></div>
<div class="row"><button class="ghost" id="edCancel">Cancelar</button><button class="primary" id="edOk" style="flex:1">Guardar y enviar</button></div>
</div></div>
<div id="zoom"><img alt=""></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const socket = io();
let me = '', creds = null;
const list = $('#list');

fetch('/api/config').then(r => r.json()).then(c => { if (c.needsCode) { $('#code').style.display = ''; $('#code').required = true; } });
$('#name').value = localStorage.getItem('chat-name') || '';

function join(c, cb) {
  socket.emit('join', c, res => {
    if (res.ok) {
      creds = c; me = c.name.trim();
      localStorage.setItem('chat-name', me);
      $('#login').style.display = 'none'; $('#app').style.display = 'flex';
      list.innerHTML = ''; res.history.forEach(m => add(m, true));
      list.scrollTop = list.scrollHeight;
    }
    if (cb) cb(res);
  });
}
$('#lf').onsubmit = e => {
  e.preventDefault();
  join({ name: $('#name').value, code: $('#code').value }, r => { $('#err').textContent = r.ok ? '' : r.error; });
};
socket.on('connect', () => { if (creds) join(creds); });
socket.on('disconnect', () => { $('#online').textContent = 'Reconectando…'; });
socket.on('online', u => { $('#online').textContent = u.length + ' en línea: ' + u.join(', '); });
socket.on('message', m => { add(m); if (m.name !== me) sndRecv(); });

const colors = ['#b5179e', '#e07a00', '#1769aa', '#2e7d32', '#c62828', '#00838f', '#6a1b9a'];
const color = n => colors[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];
function add(m, quiet) {
  const own = m.name === me;
  const nearEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  const row = document.createElement('div'); row.className = 'msg' + (own ? ' own' : '');
  const b = document.createElement('div'); b.className = 'bubble ' + m.type;
  if (!own && m.type !== 'sticker') {
    const w = document.createElement('div'); w.className = 'who'; w.textContent = m.name; w.style.color = color(m.name); b.append(w);
  }
  if (m.type === 'text') { const p = document.createElement('p'); p.textContent = m.text; b.append(p); }
  if (m.type === 'image') {
    const i = document.createElement('img'); i.className = 'pic'; i.src = m.data; i.alt = 'Imagen de ' + m.name;
    i.onclick = () => { $('#zoom img').src = m.data; $('#zoom').style.display = 'grid'; }; b.append(i);
  }
  if (m.type === 'sticker') {
    const i = document.createElement('img'); i.className = 'st'; i.src = m.data || '/stickers/' + encodeURIComponent(m.sticker); i.alt = 'Sticker'; b.append(i);
  }
  if (m.type === 'audio') { const a = document.createElement('audio'); a.controls = true; a.preload = 'metadata'; a.src = m.data; b.append(a); }
  const t = document.createElement('time'); t.textContent = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (m.type === 'sticker' && !own) { const w = document.createElement('div'); w.className = 'who'; w.textContent = m.name; w.style.color = color(m.name); b.prepend(w); }
  b.append(t); row.append(b); list.append(row);
  if (!quiet && (own || nearEnd)) list.scrollTop = list.scrollHeight;
}
$('#zoom').onclick = () => { $('#zoom').style.display = 'none'; };

function sendText() {
  const v = $('#text').value.trim(); if (!v) return;
  send({ type: 'text', text: v }); $('#text').value = '';
}
$('#send').onclick = sendText;
$('#text').onkeydown = e => { if (e.key === 'Enter') sendText(); };

$('#imgBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    send({ type: 'image', data: c.toDataURL('image/jpeg', 0.8) });
  } catch { alert('No se pudo leer esa imagen.'); }
};

let ac, muted = localStorage.getItem('chat-mute') === '1';
const mb = $('#mute'); mb.textContent = muted ? '🔕' : '🔔';
mb.onclick = () => { muted = !muted; localStorage.setItem('chat-mute', muted ? '1' : '0'); mb.textContent = muted ? '🔕' : '🔔'; };
function tone(f, d, t = 0) {
  if (muted) return;
  try {
    ac = ac || new AudioContext(); ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
    o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.18, s); g.gain.exponentialRampToValueAtTime(.001, s + d);
    o.start(s); o.stop(s + d);
  } catch {}
}
const sndSend = () => { tone(660, .08); tone(990, .12, .07); };
const sndRecv = () => { tone(880, .1); tone(1175, .16, .1); };
const send = m => { socket.emit('message', m); sndSend(); };

const em = $('#emoji'), sp = $('#stickers');
function toggle(p) {
  const shown = p.style.display === 'grid' || p.style.display === 'block';
  em.style.display = sp.style.display = 'none';
  if (!shown) { p.style.display = p === sp ? 'grid' : 'block'; if (p === sp) renderStickers(); }
}
$('#emBtn').onclick = () => toggle(em);
$('#stBtn').onclick = () => toggle(sp);
document.querySelector('emoji-picker').addEventListener('emoji-click', e => {
  const t = $('#text'), s = t.selectionStart ?? t.value.length, u = e.detail.unicode;
  t.value = t.value.slice(0, s) + u + t.value.slice(t.selectionEnd ?? s);
  t.focus(); t.selectionStart = t.selectionEnd = s + u.length;
});

let files = null;
async function renderStickers() {
  let shared = [];
  try {
    files = files || await (await fetch('/api/stickers')).json();
    shared = await (await fetch('/api/shared')).json();
  } catch {}
  const fr = document.createDocumentFragment();
  const add = document.createElement('button'); add.className = 'add'; add.textContent = '+ Crear';
  add.onclick = () => $('#sfile').click(); fr.append(add);
  shared.forEach(st => {
    const w = document.createElement('div'); w.className = 'mine';
    const b = document.createElement('button'); b.innerHTML = '<img alt="Sticker del grupo">'; b.firstChild.src = st.data;
    b.onclick = () => { send({ type: 'sticker', data: st.data }); sp.style.display = 'none'; };
    const x = document.createElement('button'); x.className = 'del'; x.textContent = '✕'; x.setAttribute('aria-label', 'Borrar sticker para todos');
    x.onclick = () => { if (confirm('¿Borrar este sticker para todos?')) { socket.emit('sticker:del', st.id); setTimeout(renderStickers, 300); } };
    w.append(b, x); fr.append(w);
  });
  (files || []).forEach(f => {
    const bt = document.createElement('button'); bt.setAttribute('aria-label', 'Sticker ' + f);
    bt.innerHTML = '<img alt="">'; bt.firstChild.src = '/stickers/' + encodeURIComponent(f);
    bt.onclick = () => { send({ type: 'sticker', sticker: f }); sp.style.display = 'none'; };
    fr.append(bt);
  });
  sp.replaceChildren(fr);
}

let img, zoom = 1, ox = 0, oy = 0, drag;
const cv = $('#cv'), cx = cv.getContext('2d');
$('#sfile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { img = await createImageBitmap(f); } catch { return alert('No se pudo leer esa imagen.'); }
  zoom = 1; ox = oy = 0; $('#zm').value = 1; $('#cap').value = '';
  $('#editor').style.display = 'grid'; draw();
};
function draw() {
  const S = 512, sh = $('#shape').value;
  cx.clearRect(0, 0, S, S); cx.save(); cx.beginPath();
  if (sh === 'circle') cx.arc(S / 2, S / 2, S / 2, 0, 7); else cx.roundRect(0, 0, S, S, sh === 'round' ? 90 : 0);
  cx.clip();
  const k = Math.max(S / img.width, S / img.height) * zoom, w = img.width * k, h = img.height * k;
  cx.drawImage(img, (S - w) / 2 + ox, (S - h) / 2 + oy, w, h);
  cx.restore();
  const t = $('#cap').value.trim();
  if (t) {
    cx.font = '800 54px Nunito,system-ui,sans-serif'; cx.textAlign = 'center'; cx.lineJoin = 'round';
    cx.lineWidth = 10; cx.strokeStyle = '#fff'; cx.fillStyle = '#1b2b27';
    cx.strokeText(t, S / 2, S - 36, S - 40); cx.fillText(t, S / 2, S - 36, S - 40);
  }
}
cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  if (!drag) return; const r = 512 / cv.getBoundingClientRect().width;
  ox = drag.ox + (e.clientX - drag.x) * r; oy = drag.oy + (e.clientY - drag.y) * r; draw();
};
cv.onpointerup = () => { drag = null; };
$('#zm').oninput = e => { zoom = +e.target.value; draw(); };
$('#shape').onchange = $('#cap').oninput = draw;
$('#edCancel').onclick = () => { $('#editor').style.display = 'none'; };
$('#edOk').onclick = () => {
  const d = cv.toDataURL('image/webp', .9);
  $('#editor').style.display = 'none'; sp.style.display = 'none';
  send({ type: 'sticker', data: d });
};

let rec, chunks = [], t0, tick, cancelled;
$('#mic').onclick = async () => {
  if (!navigator.mediaDevices || !window.MediaRecorder) return alert('Tu navegador no permite grabar audio.');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return alert('Permite el micrófono para grabar audios.'); }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t));
  rec = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
  chunks = []; cancelled = false;
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(tick);
    $('#rec').style.display = 'none'; $('#bar').style.display = 'flex';
    const dur = Math.round((Date.now() - t0) / 1000);
    if (cancelled || dur < 1) return;
    const fr = new FileReader();
    fr.onload = () => send({ type: 'audio', data: fr.result, dur });
    fr.readAsDataURL(new Blob(chunks, { type: rec.mimeType }));
  };
  rec.start(); t0 = Date.now();
  $('#recT').textContent = '● 0:00';
  $('#bar').style.display = 'none'; $('#rec').style.display = 'flex';
  tick = setInterval(() => {
    const n = Math.round((Date.now() - t0) / 1000);
    $('#recT').textContent = '● ' + Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    if (n >= 120) rec.stop();
  }, 250);
};
$('#recX').onclick = () => { cancelled = true; rec.stop(); };
$('#recOk').onclick = () => rec.stop();
</script>
</body>
</html>
